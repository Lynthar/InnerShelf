name: release

# Triggered by pushing a vN.N.N.N tag (canonical path), or manually via
# workflow_dispatch with an existing tag (for re-running after a failed release).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.2.0). Must already be pushed.'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Resolve at the tag's commit, not at HEAD of the default branch — important
      # for workflow_dispatch where github.ref is a branch ref, not the tag.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Determine version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_TAG}"
          # Tags are 3-part vN.N.N. Internally we pad to 4-part for meta.json and the
          # manifest because Jellyfin parses these via System.Version, where a missing
          # 4th component compares as -1 and breaks "is this version newer?" checks.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must be of form vN.N.N (got: '$TAG')"
            exit 1
          fi
          DISPLAY_VERSION="${TAG#v}"
          VERSION="${DISPLAY_VERSION}.0"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "displayVersion=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (manifest version=$VERSION)"

      # meta.json's version is bumped here rather than expecting the dev to
      # pre-edit it before tagging — keeps the source-of-truth on the tag and
      # makes meta.json/tag drift impossible. The repo copy stays at whatever
      # the last manual edit set; the released ZIP gets the rewritten copy.
      - name: Sync meta.json version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          META="Jellyfin.Plugin.InnerShelf/meta.json"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq --arg v "$VERSION" --arg t "$NOW" \
             '.version = $v | .timestamp = $t' "$META" > "$META.tmp"
          mv "$META.tmp" "$META"
          echo "--- meta.json after rewrite ---"
          cat "$META"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PLUGIN_DIR="Jellyfin.Plugin.InnerShelf/bin/Release/net9.0"
          STAGING="staging"
          ZIP_NAME="innershelf_${VERSION}.zip"

          mkdir -p "$STAGING"
          cp "$PLUGIN_DIR/Jellyfin.Plugin.InnerShelf.dll" "$STAGING/"
          cp "$PLUGIN_DIR/AngleSharp.dll" "$STAGING/"
          cp "$PLUGIN_DIR/meta.json" "$STAGING/"

          (cd "$STAGING" && zip -r "../$ZIP_NAME" .)

          # Jellyfin's plugin manifest format uses MD5 for the checksum field.
          CHECKSUM="$(md5sum "$ZIP_NAME" | awk '{print $1}')"
          echo "zip=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Built $ZIP_NAME (md5=$CHECKSUM)"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: ${{ steps.package.outputs.zip }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Append (or update) the new version in the public plugin manifest hosted on
      # gh-pages. Bootstraps the branch as an orphan if it doesn't exist yet.
      # Reads plugin metadata fields (guid/name/description/overview/owner/category,
      # plus optional imageUrl) from meta.json so the entry stays in sync with what
      # users see in the plugin catalog.
      - name: Publish manifest to gh-pages
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add gh-pages-tree gh-pages
          else
            echo "gh-pages branch missing — bootstrapping orphan branch"
            git worktree add --detach gh-pages-tree
            (cd gh-pages-tree && git checkout --orphan gh-pages && git rm -rf . 2>/dev/null || true)
          fi

          META="$PWD/Jellyfin.Plugin.InnerShelf/meta.json"
          GUID="$(jq -r '.guid' "$META")"
          NAME="$(jq -r '.name' "$META")"
          DESCRIPTION="$(jq -r '.description' "$META")"
          OVERVIEW="$(jq -r '.overview' "$META")"
          OWNER="$(jq -r '.owner' "$META")"
          CATEGORY="$(jq -r '.category' "$META")"
          TARGET_ABI="$(jq -r '.targetAbi' "$META")"
          IMAGE_URL="$(jq -r '.imageUrl // ""' "$META")"

          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
          CHANGELOG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

          cd gh-pages-tree
          [ -f manifest.json ] || echo '[]' > manifest.json

          NEW_VERSION=$(jq -n \
            --arg v "$VERSION" \
            --arg c "See $CHANGELOG_URL" \
            --arg t "$TARGET_ABI" \
            --arg s "$SOURCE_URL" \
            --arg ck "$CHECKSUM" \
            --arg ts "$NOW" \
            '{version: $v, changelog: $c, targetAbi: $t, sourceUrl: $s, checksum: $ck, timestamp: $ts}')

          # Build the plugin entry from scratch each time so meta.json edits
          # (description, imageUrl, etc.) propagate without manual gh-pages surgery.
          # Existing versions are preserved; the new version is added, deduped by
          # version, and sorted newest-first by timestamp.
          EXISTING_VERSIONS=$(jq --arg g "$GUID" '[.[] | select(.guid == $g) | .versions[]?]' manifest.json)
          MERGED_VERSIONS=$(echo "$EXISTING_VERSIONS" | jq --argjson nv "$NEW_VERSION" \
            '[$nv] + . | unique_by(.version) | sort_by(.timestamp) | reverse')

          if [ -n "$IMAGE_URL" ]; then
            NEW_ENTRY=$(jq -n \
              --arg g "$GUID" --arg n "$NAME" --arg d "$DESCRIPTION" --arg o "$OVERVIEW" \
              --arg ow "$OWNER" --arg ct "$CATEGORY" --arg img "$IMAGE_URL" \
              --argjson v "$MERGED_VERSIONS" \
              '{guid: $g, name: $n, description: $d, overview: $o, owner: $ow, category: $ct, imageUrl: $img, versions: $v}')
          else
            NEW_ENTRY=$(jq -n \
              --arg g "$GUID" --arg n "$NAME" --arg d "$DESCRIPTION" --arg o "$OVERVIEW" \
              --arg ow "$OWNER" --arg ct "$CATEGORY" \
              --argjson v "$MERGED_VERSIONS" \
              '{guid: $g, name: $n, description: $d, overview: $o, owner: $ow, category: $ct, versions: $v}')
          fi

          jq --arg g "$GUID" --argjson e "$NEW_ENTRY" \
            'map(select(.guid != $g)) + [$e]' \
            manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

          # Sync the plugin icon so the manifest's imageUrl resolves to a file on
          # gh-pages (avoids cross-branch raw.githubusercontent.com hits).
          if [ -f ../InnerShelf.png ]; then
            cp ../InnerShelf.png .
            git add InnerShelf.png
          fi

          echo "--- manifest.json after update ---"
          cat manifest.json

          git add manifest.json
          if git diff --cached --quiet; then
            echo "No manifest changes to push (already up to date)"
            exit 0
          fi
          git commit -m "Publish ${TAG}"
          git push origin gh-pages
